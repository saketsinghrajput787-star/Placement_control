services:
  - type: web
    name: placement-control-tower-backend
    env: python
    buildCommand: "pip install -r backend/requirements.txt && python scripts/seed_database.py"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        fromDatabase:
          name: placement-tower-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: GROQ_API_KEY
        sync: false

databases:
  - name: placement-tower-db
    databaseName: placement_tower
    user: placement_admin
